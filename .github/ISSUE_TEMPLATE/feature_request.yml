name: Feature request
description: Propose a new capability or a change to the workflow.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does the current workflow get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it behave? If you can, state it as a check that would fail today and pass once it is done.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: SDLC stage
      options:
        - Plan / intent
        - Design / spec
        - Build / red-green cycle
        - Test / quality contract
        - Deploy / review and delivery
        - Maintain / incidents
        - Install, hosts or extensions
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
